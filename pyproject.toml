[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bandcamp-plex-sync"
version = "1.0.0"
description = "Synchronize a purchased Bandcamp collection with a Plex music library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Christopher Patti" }]
keywords = ["bandcamp", "plex", "music", "flac"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "browser-cookie3>=0.20.1",
  "cyclopts>=3.0.0",
  "mutagen>=1.47.0",
  "requests>=2.32.0",
  "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/feoh/bandcamp-plex-sync"
Repository = "https://github.com/feoh/bandcamp-plex-sync"
Issues = "https://github.com/feoh/bandcamp-plex-sync/issues"

[project.scripts]
bandcamp-plex-sync = "bandcamp_plex_sync.cli:main"

[dependency-groups]
dev = ["mypy>=1.16.0", "pre-commit>=4.0.0", "ruff>=0.11.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
